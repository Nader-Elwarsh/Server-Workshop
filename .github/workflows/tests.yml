# يشغّل كل اختبارات المشروع تلقائيًا مع كل رفع على GitHub (وعلى أي Pull Request).
# لو فشل: هتلاقي علامة ❌ جنب الـcommit في تبويب Actions قبل ما تكمّل.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: syntax + storage + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
  # اختبار قواعد Firestore على الـemulator: يدوي بس (Actions ← tests ← Run workflow). شغّله قبل نشر firestore.rules.
  rules-emulator:
    name: firestore rules (emulator, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:firestore-rules
