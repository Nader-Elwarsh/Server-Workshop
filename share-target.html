<div id="sharePhoneNote" class="hint"></div>
<section id="qoCustomerBox" class="quick-add hidden wide"><h3>➕ إضافة عميل سريع</h3><div class="form-grid"><label>اسم العميل<input id="qoName"></label><label>التليفون<input id="qoPhone" inputmode="tel"></label><label>المركز<div class="part-autocomplete"><input type="text" id="qoCenterSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم المركز..." autocomplete="off" data-wf-event="input" data-wf-code="filterListOptions('qoCenter', this.value)" data-wf-refocus-code="filterListOptions('qoCenter', this.value)" data-wf-blur="hideListResults" data-wf-args='["qoCenter"]'><input type="hidden" id="qoCenter"><div id="qoCenterResults" class="part-autocomplete-results hidden"></div></div></label><label>القرية<div class="part-autocomplete"><input type="text" id="qoVillageSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم القرية..." autocomplete="off" data-wf-event="input" data-wf-code="filterListOptions('qoVillage', this.value)" data-wf-refocus-code="filterListOptions('qoVillage', this.value)" data-wf-blur="hideListResults" data-wf-args='["qoVillage"]'><input type="hidden" id="qoVillage"><div id="qoVillageResults" class="part-autocomplete-results hidden"></div></div></label><label>الشارع / علامة مميزة <small>اختياري</small><input id="qoStreet"></label></div><div class="actions"><button type="button" class="primary" data-wf-click="saveQuickCustomerHome">💾 حفظ العميل واختياره</button><button type="button" class="secondary" data-wf-click="closeQuickAdd" data-wf-args='["qoCustomerBox"]'>إلغاء</button></div></section>
<label class="wide">الجهاز<div class="select-add"><select id="qoDevice"></select><button type="button" class="secondary mini-action quick-add-btn" data-opens="qoDeviceBox" data-wf-click="toggleQuickAdd" data-wf-args='["qoDeviceBox"]'>➕ جهاز</button></div></label>
<section id="qoDeviceBox" class="quick-add hidden wide"><h3>➕ إضافة جهاز سريع</h3><div class="form-grid"><label>نوع الجهاز<div class="part-autocomplete"><input type="text" id="qoTypeSearch" class="part-autocomplete-input" placeholder="🔍 اكتب نوع الجهاز..." autocomplete="off" data-wf-event="input" data-wf-code="filterListOptions('qoType', this.value)" data-wf-refocus-code="filterListOptions('qoType', this.value)" data-wf-blur="hideListResults" data-wf-args='["qoType"]'><input type="hidden" id="qoType"><div id="qoTypeResults" class="part-autocomplete-results hidden"></div></div></label><label>التصنيف<div class="part-autocomplete"><input type="text" id="qoCategorySearch" class="part-autocomplete-input" placeholder="🔍 اكتب التصنيف..." autocomplete="off" data-wf-event="input" data-wf-code="filterListOptions('qoCategory', this.value)" data-wf-refocus-code="filterListOptions('qoCategory', this.value)" data-wf-blur="hideListResults" data-wf-args='["qoCategory"]'><input type="hidden" id="qoCategory"><div id="qoCategoryResults" class="part-autocomplete-results hidden"></div></div></label><label>الماركة<div class="part-autocomplete"><input type="text" id="qoBrandSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم الماركة..." autocomplete="off" data-wf-event="input" data-wf-code="filterListOptions('qoBrand', this.value)" data-wf-refocus-code="filterListOptions('qoBrand', this.value)" data-wf-blur="hideListResults" data-wf-args='["qoBrand"]'><input type="hidden" id="qoBrand"><div id="qoBrandResults" class="part-autocomplete-results hidden"></div></div></label><label>الموديل <small>اختياري</small><input id="qoModel"></label></div><div class="actions"><button type="button" class="primary" data-wf-click="saveQuickDeviceHome">💾 حفظ الجهاز واختياره</button><button type="button" class="secondary" data-wf-click="closeQuickAdd" data-wf-args='["qoDeviceBox"]'>إلغاء</button></div></section>
