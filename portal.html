<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001b4d"><title>بوابة العملاء | الورشة الفنية</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#667085;--pri:#0b57d0;--bd:#dde3ee;--ok:#1a7f37;--err:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1f27;--tx:#e9edf2;--mut:#9aa5b1;--pri:#5fb0ff;--bd:#2c3340;--ok:#4ade80;--err:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Tahoma,Arial,sans-serif}
header{background:#001b4d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header b{font-size:17px}
main{max-width:680px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
label{font-size:14px;font-weight:600}input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px}
button{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
a{color:var(--pri)}nav{display:flex;gap:5px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;overflow-x:auto}nav button{flex:1;min-width:64px;padding:8px 4px;font-size:12.5px;white-space:nowrap}nav button.off{background:transparent;color:var(--pri);border:1px solid var(--bd)}
.err{color:var(--err)}.ok{color:var(--ok)}.mut{color:var(--mut);font-size:13px}.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.steps i.on{background:var(--pri)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--bd);font-size:13px;font-weight:600;white-space:nowrap}.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cb{position:relative}.cbl{position:absolute;inset-inline:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:210px;overflow:auto;margin-top:-8px}.cbl:empty{display:none}
.opt{display:block;width:100%;text-align:right;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:10px}.opt.add{color:var(--pri)}
details{border:1px solid var(--bd);border-radius:10px;margin:6px 0;padding:8px 10px}summary{cursor:pointer;font-weight:600}.sec{border-top:1px dashed var(--bd);margin-top:8px;padding-top:6px}
.stat{display:flex;gap:8px}.stat div{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:8px}.stat b{font-size:20px;display:block}
</style>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script></head>
<body><header><b>🔧 الورشة الفنية — بوابة العملاء</b><button class="sec" id="outBtn" style="display:none;color:#fff;border-color:#fff" onclick="auth.signOut()">خروج</button></header><main id="app">جاري التحميل…</main>
<script>
firebase.initializeApp({apiKey:"AIzaSyAISlRIHOVKhupLS8l2hG_QwY6Wkchq9W8",authDomain:"elwarsha-elfanya.firebaseapp.com",projectId:"elwarsha-elfanya",storageBucket:"elwarsha-elfanya.firebasestorage.app",messagingSenderId:"916075814550",appId:"1:916075814550:web:90e6b0c01b58abc614ecb7"});
var auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue,app=document.getElementById("app"),SYN="@phone.elwarsha.app";
var cfg={centers:["مطاي","بني مزار"],villages:{"مطاي":["مطاي البلد","أبو عزيز","بردنوها","منبال","أبوان","حلوة","سيلة الشرقية","سيلة الغربية","عزبة بطرس","عزبة أبو شحاته"],"بني مزار":[]},types:{"غسالات":["هاف أوتوماتيك","فوق أوتوماتيك","أمامي أوتوماتيك"],"ثلاجات":["عادية","نوفروست","ديب فريزر"],"تكييفات":["سبليت","شباك"],"سخانات":["كهرباء","غاز"],"كولديرات":["كولدير"],"أجهزة_أخرى":["عام"]},brands:[],executionPlaces:["عند العميل","الورشة"]};
var U=null,me=null,devs=[],pend=[],orders=[],comps=[],tab="home",unsubs=[],signingUp=false,mode="login",msg="",preDev="",CB={},STEPS=["جديد","جاري التنفيذ","مكتمل"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ms(v){return v&&v.toDate?v.toDate().getTime():(Date.parse(v)||0)}
function fd(v){var t=ms(v);return t?new Date(t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"}):""}
function $(id){return document.getElementById(id)}function val(id){var e=$(id);return e?e.value.trim():""}
function opts(a,sel){return a.map(function(x){return'<option'+(x===sel?" selected":"")+'>'+esc(x)+'</option>'}).join("")}
function say(t,ok){msg='<p class="'+(ok?"ok":"err")+'">'+esc(t)+'</p>';var m=$("msg");if(m)m.innerHTML=msg}
function tg(id){var e=$(id);if(e)e.style.display=e.style.display==="none"?"":"none"}
function errText(e){var c=e&&e.code||"";return({"auth/email-already-in-use":"الرقم أو الإيميل مسجّل قبل كده.","auth/invalid-email":"البيانات غير صحيحة.","auth/weak-password":"كلمة المرور ضعيفة (6 حروف على الأقل).","auth/invalid-credential":"الرقم أو كلمة المرور غير صحيحة.","auth/wrong-password":"كلمة المرور غير صحيحة.","auth/user-not-found":"الرقم أو كلمة المرور غير صحيحة.","auth/too-many-requests":"محاولات كتير، جرّب بعد شوية.","auth/requires-recent-login":"سجّل خروج وادخل تاني وجرّب.","permission-denied":"مش مسموح لك بالعملية دي."})[c]||"حصل خطأ، جرّب تاني."}
function normPhone(s){var d=String(s||"").replace(/\D/g,"");if(d.indexOf("0020")===0)d=d.slice(4);if(d.length===12&&d.indexOf("20")===0)d="0"+d.slice(2);if(d.length===10&&d[0]==="1")d="0"+d;return/^01[0125]\d{8}$/.test(d)?d:""}
function vill(c){var v=cfg.villages||{};return Array.isArray(v)?v:(v[c]||[])}

/* ---- خانة اختيار بحث + إضافة ---- */
function combo(id,items,ph,init){CB[id]={items:items};return'<div class="cb"><input id="'+id+'_t" placeholder="'+esc(ph)+'" value="'+esc(init||"")+'" autocomplete="off" oninput="cbF(\''+id+'\')" onfocus="cbF(\''+id+'\')"><div class="cbl" id="'+id+'_l"></div></div>'}
function cbF(id){var c=CB[id],q=val(id+"_t"),h="",n=0;c.items.forEach(function(x,i){if(n<25&&(!q||x.indexOf(q)>-1)){n++;h+='<button type="button" class="opt" onclick="cbPick(\''+id+'\','+i+')">'+esc(x)+'</button>'}});if(q&&c.items.indexOf(q)<0)h+='<button type="button" class="opt add" onclick="$(\''+id+'_l\').innerHTML=\'\'">➕ إضافة «'+esc(q)+'» (هتتبعت للورشة للموافقة)</button>';$(id+"_l").innerHTML=h}
function cbPick(id,i){$(id+"_t").value=CB[id].items[i];$(id+"_l").innerHTML=""}
function cbNew(id){var v=val(id+"_t");return v&&CB[id].items.indexOf(v)<0}
function suggest(kind,value,parent){if(!value)return Promise.resolve();return db.collection("portalSuggestions").add({kind:kind,value:value.slice(0,80),parent:parent||"",by:U.uid,status:"pending",createdAt:FV.serverTimestamp()}).catch(function(){})}
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest(".cb"))document.querySelectorAll(".cbl").forEach(function(x){x.innerHTML=""})});

/* ---- الدخول والتسجيل ---- */
function showAuth(){var su=mode==="signup";$("outBtn").style.display="none";
app.innerHTML='<div class="card"><h3>'+(su?"إنشاء حساب جديد":"تسجيل الدخول")+'</h3>'+
(su?'<label>الاسم</label><input id="f_name" autocomplete="name"><label>رقم التليفون (ده اللي هتدخل بيه)</label><input id="f_phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01xxxxxxxxx"><label>المركز</label><select id="f_center" onchange="CB.v.items=vill(this.value);$(\'v_t\').value=\'\'"><option value="">اختر</option>'+opts(cfg.centers)+'</select><label>القرية / المنطقة (اكتب وابحث)</label>'+combo("v",[],"ابدأ اكتب اسم القرية")+'<label>العنوان بالتفصيل</label><input id="f_street"><label>إيميل (اختياري — لاسترجاع كلمة المرور)</label><input id="f_email" type="email" autocomplete="email">':'<label>رقم التليفون (أو الإيميل)</label><input id="f_id" autocomplete="username">')+
'<label>كلمة المرور</label><input id="f_pw" type="password" autocomplete="'+(su?"new-password":"current-password")+'"><button onclick="'+(su?"signup()":"login()")+'">'+(su?"إنشاء الحساب":"دخول")+'</button> <button class="sec" onclick="mode=\''+(su?"login":"signup")+'\';showAuth()">'+(su?"عندي حساب":"حساب جديد")+'</button>'+(su?"":'<p><a href="#" onclick="forgot();return false">نسيت كلمة المرور؟</a></p>')+'<div id="msg">'+msg+'</div></div><p class="mut" style="text-align:center"><a href="login.html">🔐 دخول كمدير / موظف</a></p>';msg=""}
function idToEmail(id){if(id.indexOf("@")>-1)return Promise.resolve(id);var p=normPhone(id);if(!p)return Promise.reject({code:"auth/invalid-credential"});return db.collection("phoneIndex").doc(p).get().then(function(d){if(!d.exists)throw{code:"auth/invalid-credential"};return d.data().email})}
function login(){idToEmail(val("f_id")).then(function(em){return auth.signInWithEmailAndPassword(em,$("f_pw").value)}).catch(function(e){say(errText(e))})}
function forgot(){idToEmail(val("f_id")).then(function(em){if(em.slice(-SYN.length)===SYN)return say("الحساب ده من غير إيميل. كلّم الورشة عشان تساعدك.");return auth.sendPasswordResetEmail(em).then(function(){say("بعتنالك رابط تغيير كلمة المرور على الإيميل المسجّل.",true)})}).catch(function(){say("اكتب رقم التليفون الأول (لازم يكون مسجّل).")})}
function signup(){var n=val("f_name"),p=normPhone(val("f_phone")),c=val("f_center"),v=val("v_t"),em=val("f_email");if(n.length<2)return say("اكتب اسمك.");if(!p)return say("رقم التليفون غير صحيح (01xxxxxxxxx).");if(!c)return say("اختر المركز.");if($("f_pw").value.length<6)return say("كلمة المرور 6 حروف على الأقل.");
var isNew=cbNew("v"),ae=em||p+SYN;signingUp=true;
db.collection("phoneIndex").doc(p).get().then(function(d){if(d.exists)throw{code:"auth/email-already-in-use"};return auth.createUserWithEmailAndPassword(ae,$("f_pw").value)}).then(function(cr){U=cr.user;
return db.collection("phoneIndex").doc(p).set({email:ae,uid:U.uid}).catch(function(e){return U.delete().then(function(){throw{code:"auth/email-already-in-use"}})}).then(function(){return db.collection("customers").doc(U.uid).set({name:n,phone:p,email:em,mainAddress:{center:c,village:v,street:val("f_street")},portal:true,createdAt:FV.serverTimestamp()})}).then(function(){return isNew?suggest("village",v,c):0})}).then(function(){signingUp=false;start(auth.currentUser)}).catch(function(e){signingUp=false;say(errText(e))})}

/* ---- بعد الدخول ---- */
function stop(){unsubs.forEach(function(f){f()});unsubs=[]}
function start(u){U=u;$("outBtn").style.display="";
db.collection("staff").doc(u.uid).get().then(function(s){if(s.exists){stop();app.innerHTML='<div class="card">ده حساب موظف. استخدم لوحة الورشة.</div><p><a href="index.html">فتح لوحة الورشة</a></p>';return auth.signOut()}
return db.collection("portal").doc("config").get().then(function(c){if(c.exists){var d=c.data();Object.keys(d).forEach(function(k){if(d[k]&&(Array.isArray(d[k])?d[k].length:Object.keys(d[k]).length))cfg[k]=d[k]})}}).catch(function(){}).then(function(){return db.collection("customers").doc(u.uid).get()}).then(function(c){if(!c.exists){app.innerHTML='<div class="card">حسابك مش مكتمل. سجّل خروج وأنشئ حساب جديد.</div>';return}
me=c.data();stop();var q=function(col){return db.collection(col).where("customerId","==",u.uid)},L=function(col,fn){unsubs.push(q(col).onSnapshot(function(s){fn(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}));render()},function(){}))};
L("devices",function(x){devs=x});L("portalRequests",function(x){pend=x});L("portalOrders",function(x){orders=x});L("portalComplaints",function(x){comps=x});render()})}).catch(function(e){app.innerHTML='<div class="card err">تعذّر تحميل حسابك ('+esc(errText(e))+')</div>'})}
auth.onAuthStateChanged(function(u){if(signingUp)return;if(!u){stop();U=null;me=null;showAuth();return}start(u)});

function dev(id){return devs.find(function(d){return d.id===id})||{}}
function label(d){return[d.type,d.brand,d.model].filter(Boolean).join(" ")||"جهاز"}
function isP(o){return o.source==="portal"}
function render(){if(!me)return;var t=[["home","🏠 ملفي"],["shop","📋 أوامر الورشة"],["mine","🧾 طلباتي"],["devices","🔧 أجهزتي"],["me","👤 حسابي"]];
app.innerHTML='<nav>'+t.map(function(x){return'<button class="'+(tab===x[0]?"":"off")+'" onclick="tab=\''+x[0]+'\';msg=\'\';render()">'+x[1]+'</button>'}).join("")+'</nav>'+({home:vHome,shop:vShop,mine:vMine,devices:vDevices,me:vMe})[tab]()}
function sorted(a){return a.slice().sort(function(x,y){return ms(y.createdAt)-ms(x.createdAt)})}
function money(n){return(+n||0).toLocaleString("ar-EG")}
function oCard(o,det){var i=STEPS.indexOf(o.status),t=o.deviceLabel||label(dev(o.deviceId)),h='<div class="row"><b>'+(o.no?"أمر #"+esc(o.no)+" — ":"")+esc(t)+'</b><span class="badge">'+esc(o.status)+'</span></div>';
if(o.status!=="ملغي")h+='<div class="steps">'+STEPS.map(function(s,k){return'<i class="'+(k<=i?"on":"")+'"></i>'}).join("")+'</div>';
h+='<div>'+esc(o.fault)+'</div>'+(o.visit?'<div class="mut">📅 الموعد: '+esc(o.visit)+'</div>':"")+(o.executionPlace?'<div class="mut">📍 '+esc(o.executionPlace)+'</div>':"")+(o.partsWaiting?'<div class="mut">⏳ بانتظار قطع غيار</div>':"")+(o.workshopStatus&&o.workshopStatus!=="غير مطلوب"?'<div class="mut">🏭 '+esc(o.workshopStatus)+'</div>':"");
if(o.work)h+='<div class="sec"><b>🛠️ اللي اتعمل</b><div>'+esc(o.work)+'</div></div>';
if(o.parts&&o.parts.length)h+='<div class="sec"><b>🔩 قطع الغيار</b>'+o.parts.map(function(p){return'<div class="row"><span>'+esc(p.name)+" × "+esc(p.qty)+'</span>'+(p.price!==undefined?'<span>'+money(p.price*p.qty)+' ج</span>':"")+'</div>'}).join("")+'</div>';
if(o.labor!==undefined&&+o.labor)h+='<div class="row sec"><span>أجرة اليد</span><b>'+money(o.labor)+' ج</b></div>';
if(o.total!==undefined&&+o.total)h+='<div class="row sec"><span>الإجمالي: <b>'+money(o.total)+'</b> ج</span><span>العربون: '+money(o.deposit)+' ج</span><span>المتبقي: <b>'+money(o.remain)+'</b> ج</span></div>';
if(o.history&&o.history.length)h+='<div class="sec"><b>🕒 مراحل الأمر</b>'+o.history.map(function(x){return'<div class="mut">'+esc(x.to)+" — "+esc(fd(x.at))+'</div>'}).join("")+'</div>';
if(det!==false&&o.status==="مكتمل"){var cs=comps.filter(function(c){return c.orderId===o.id});h+='<div class="sec">'+cs.map(function(c){return'<div class="card"><div class="row"><b>📣 شكوى</b><span class="badge">'+esc(c.status)+'</span></div>'+esc(c.text)+(c.reply?'<div class="ok">رد الورشة: '+esc(c.reply)+'</div>':"")+'</div>'}).join("")+'<button class="sec" onclick="tg(\'cf_'+esc(o.id)+'\')">📣 تسجيل شكوى على الأمر ده</button><div id="cf_'+esc(o.id)+'" style="display:none"><textarea id="ct_'+esc(o.id)+'" rows="3" placeholder="اكتب الشكوى بالتفصيل"></textarea><button onclick="sendComp(\''+esc(o.id)+'\',\''+esc(o.no||"")+'\')">إرسال الشكوى</button></div></div>'}
return h}
function sendComp(id,no){var t=val("ct_"+id);if(t.length<5)return say("اكتب تفاصيل الشكوى.");db.collection("portalComplaints").add({customerId:U.uid,orderId:id,orderNo:String(no),text:t.slice(0,1000),status:"جديد",reply:"",portal:true,createdAt:FV.serverTimestamp()}).then(function(){say("اتبعتت للورشة ✅",true)}).catch(function(e){say(errText(e))})}
function list(a,empty){return a.length?sorted(a).map(function(o){return'<div class="card">'+oCard(o)+'</div>'}).join(""):'<div class="card mut">'+empty+'</div>'}
function vHome(){var a=me.mainAddress||{},open=orders.filter(function(o){return o.status==="جديد"||o.status==="جاري التنفيذ"}).length,done=orders.filter(function(o){return o.status==="مكتمل"}).length;
var h='<div class="card"><b>'+esc(me.name)+'</b><div class="mut">📞 '+esc(me.phone)+" — 📍 "+esc([a.center,a.village,a.street].filter(Boolean).join(" - "))+'</div><div class="stat" style="margin-top:10px"><div><b>'+devs.length+'</b>أجهزة</div><div><b>'+open+'</b>مفتوحة</div><div><b>'+done+'</b>مكتملة</div><div><b>'+comps.length+'</b>شكاوى</div></div></div>';
if(!devs.length)return h+'<div class="card">ابدأ بإضافة جهازك من «أجهزتي».</div>';
return h+devs.map(function(d){var os=sorted(orders.filter(function(o){return o.deviceId===d.id})),ps=pend.filter(function(p){return p.deviceId===d.id&&!orders.some(function(o){return o.id===p.id})});
return'<div class="card">'+(d.photo?'<img src="'+esc(d.photo)+'" style="max-width:90px;border-radius:8px;float:left;margin-inline-start:8px">':"")+'<b>'+esc(label(d))+'</b><div class="mut">'+esc([d.category,d.desc].filter(Boolean).join(" — "))+'</div><div class="mut">'+(os.length+ps.length)+' أمر/طلب</div>'+
ps.map(function(p){return'<details><summary>⏳ '+esc(p.fault.slice(0,40))+' — بانتظار مراجعة الورشة</summary>'+esc(p.fault)+'</details>'}).join("")+os.map(function(o){return'<details><summary>'+(o.no?"#"+esc(o.no)+" — ":"")+esc(o.status)+" — "+esc((o.fault||"").slice(0,30))+'</summary>'+oCard(o)+'</details>'}).join("")+'<button class="sec" style="margin-top:8px" onclick="preDev=\''+esc(d.id)+'\';tab=\'mine\';render()">➕ طلب صيانة لهذا الجهاز</button><div style="clear:both"></div></div>'}).join("")}
function vShop(){return list(orders.filter(function(o){return!isP(o)}),"مفيش أوامر من الورشة لسه.")}
function vMine(){var seen={};orders.forEach(function(o){seen[o.id]=1});var ps=pend.filter(function(p){return!seen[p.id]}).map(function(p){return'<div class="card"><div class="row"><b>'+esc(label(dev(p.deviceId)))+'</b><span class="badge">'+(p.rejected?"مرفوض":"بانتظار مراجعة الورشة")+'</span></div>'+esc(p.fault)+'<div class="mut">'+esc(fd(p.createdAt))+'</div></div>'}).join("");
var form=devs.length?'<div class="card"><h4>➕ طلب صيانة جديد</h4><label>الجهاز</label><select id="r_dev">'+devs.map(function(d){return'<option value="'+esc(d.id)+'"'+(d.id===preDev?" selected":"")+'>'+esc(label(d))+'</option>'}).join("")+'</select><label>وصف العطل</label><textarea id="r_fault" rows="3"></textarea><label>الموعد المناسب (اختياري)</label><input id="r_visit" type="date"><label>مكان التنفيذ</label><select id="r_place">'+opts(cfg.executionPlaces)+'</select><label>ملاحظات (اختياري)</label><input id="r_note"><button onclick="sendReq()">إرسال الطلب</button><div id="msg">'+msg+'</div></div>':'<div class="card">لازم تضيف جهاز الأول من «أجهزتي».</div>';
return form+ps+'<h4>🧾 أوامر شغل عن طريق العميل</h4>'+list(orders.filter(isP),"لسه ما بعتش طلبات.")}
function sendReq(){var f=val("r_fault");if(f.length<3)return say("اكتب وصف العطل.");db.collection("portalRequests").add({customerId:U.uid,deviceId:val("r_dev"),fault:f.slice(0,1000),visit:val("r_visit"),executionPlace:val("r_place"),note:val("r_note").slice(0,500),handled:false,portal:true,createdAt:FV.serverTimestamp()}).then(function(){preDev="";msg="";render();say("اتبعت الطلب للورشة ✅",true)}).catch(function(e){say(errText(e))})}
function vDevices(){var t=Object.keys(cfg.types);return devs.map(function(d){return'<div class="card">'+(d.photo?'<img src="'+esc(d.photo)+'" style="max-width:100px;border-radius:8px;float:left;margin-inline-start:8px">':"")+'<b>'+esc(label(d))+'</b><div class="mut">'+esc([d.category,d.desc].filter(Boolean).join(" — "))+'</div><div style="clear:both"></div></div>'}).join("")+
'<div class="card"><h4>إضافة جهاز</h4><label>النوع</label><select id="d_type" onchange="fillCat()">'+opts(t)+'</select><label>التصنيف</label><select id="d_cat">'+opts(cfg.types[t[0]]||[])+'</select><label>الماركة (اكتب وابحث)</label>'+combo("b",cfg.brands||[],"مثال: Fresh")+'<label>الموديل</label><input id="d_model"><label>ملاحظات</label><input id="d_desc"><label>صورة (اختياري)</label><input id="d_photo" type="file" accept="image/*"><button onclick="addDev()">حفظ الجهاز</button><div id="msg">'+msg+'</div></div>'}
function fillCat(){$("d_cat").innerHTML=opts(cfg.types[val("d_type")]||[])}
function resize(file){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var m=720,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.62)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
function upload(b){var fd=new FormData();fd.append("file",b);fd.append("upload_preset","workshop_unsigned");return fetch("https://api.cloudinary.com/v1_1/ogmpqgu4/image/upload",{method:"POST",body:fd}).then(function(r){return r.json()}).then(function(j){if(!j.secure_url)throw 0;return j.secure_url})}
function addDev(){var b=val("b_t");if(!b)return say("اكتب الماركة.");var f=$("d_photo").files[0],isNew=cbNew("b");say("جاري الحفظ…",true);
(f?resize(f).then(upload):Promise.resolve("")).then(function(url){return db.collection("devices").add({customerId:U.uid,addressKey:"main",type:val("d_type"),category:val("d_cat"),brand:b.slice(0,60),model:val("d_model").slice(0,80),desc:val("d_desc").slice(0,300),photo:url,portal:true,createdAt:FV.serverTimestamp()})}).then(function(){return isNew?suggest("brand",b):0}).then(function(){msg="";render()}).catch(function(e){say(e&&e.code?errText(e):"تعذّر حفظ الجهاز أو رفع الصورة.")})}
function vMe(){var a=me.mainAddress||{};return'<div class="card"><h4>بياناتي</h4><label>الاسم</label><input id="m_name" value="'+esc(me.name)+'"><label>رقم التليفون (ثابت — هو اللي بتدخل بيه)</label><input value="'+esc(me.phone)+'" disabled><label>المركز</label><select id="m_center" onchange="CB.mv.items=vill(this.value)">'+opts(cfg.centers,a.center)+'</select><label>القرية</label>'+combo("mv",vill(a.center),"اكتب وابحث",a.village)+'<label>العنوان بالتفصيل</label><input id="m_street" value="'+esc(a.street)+'"><button onclick="saveMe()">حفظ</button><div id="msg">'+msg+'</div></div>'+
'<div class="card"><h4>🔑 تغيير كلمة المرور</h4><label>الحالية</label><input id="pw0" type="password" autocomplete="current-password"><label>الجديدة</label><input id="pw1" type="password" autocomplete="new-password"><button onclick="chPw()">تغيير</button><div id="msg2"></div></div>'}
function saveMe(){var n=val("m_name"),c=val("m_center"),v=val("mv_t"),isNew=cbNew("mv");if(n.length<2)return say("اكتب اسمك.");db.collection("customers").doc(U.uid).update({name:n,mainAddress:{center:c,village:v,street:val("m_street")},updatedAt:FV.serverTimestamp()}).then(function(){me.name=n;me.mainAddress={center:c,village:v,street:val("m_street")};return isNew?suggest("village",v,c):0}).then(function(){say("اتحفظ ✅",true)}).catch(function(e){say(errText(e))})}
function chPw(){var m=$("msg2"),o=$("pw0").value,n=$("pw1").value;if(n.length<6){m.innerHTML='<p class="err">الجديدة 6 حروف على الأقل.</p>';return}var u=auth.currentUser;u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o)).then(function(){return u.updatePassword(n)}).then(function(){m.innerHTML='<p class="ok">اتغيّرت ✅</p>'}).catch(function(e){m.innerHTML='<p class="err">'+esc(errText(e))+'</p>'})}
</script></body></html>
