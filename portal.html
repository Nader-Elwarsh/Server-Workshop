function saveMe(){var n=val("m_name"),c=val("mc_t"),v=val("mv_t"),cN=cbNew("mc"),vN=cbNew("mv")&&v;if(n.length<2)return say("اكتب اسمك.");if(!c)return say("اكتب المركز.");var ad={center:c,village:v,street:val("m_street")};db.collection("customers").doc(CID).update({name:n,mainAddress:ad,updatedAt:FV.serverTimestamp()}).then(function(){me.name=n;me.mainAddress=ad;return cN?suggest("center",c):0}).then(function(){return vN?suggest("village",v,c):0}).then(function(){say("اتحفظ ✅",true)}).catch(function(e){say(errText(e))})}
function chPw(){var m=$("msg2"),o=$("pw0").value,n=$("pw1").value;if(n.length<6){m.innerHTML='<p class="err">الجديدة 6 حروف على الأقل.</p>';return}var u=auth.currentUser;u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o)).then(function(){return u.updatePassword(n)}).then(function(){m.innerHTML='<p class="ok">اتغيّرت ✅</p>'}).catch(function(e){m.innerHTML='<p class="err">'+esc(errText(e))+'</p>'})}
</script></body></html>
