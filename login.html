<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001b4d"><meta name="description" content="الورشة الفنية: نظام إدارة ورش صيانة الأجهزة المنزلية. هذه الصفحة لدخول الموظفين والمديرين فقط."><title>الورشة الفنية | دخول الموظفين</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317324d'/%3E%3Cpath d='M38 19a3 3 0 0 0 0 4l3 3a3 3 0 0 0 4 0l8-8a15 15 0 0 1-20 20L15 52a5 5 0 0 1-7-7l15-15a15 15 0 0 1 20-20l-8 8z' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round' transform='translate(4 2) scale(.88)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192-v12.png">
<link rel="stylesheet" href="style.css"><script src="theme.js" defer></script>
<style>
.login-main{max-width:440px;padding-block:20px}
.login-intro{margin:0 0 14px;padding:14px 16px;border-radius:14px;background:var(--bg-elevated);box-shadow:0 2px 10px #0000000d;line-height:1.8}
.login-intro b{display:block;font-size:17px;margin-bottom:2px}
.login-intro span{color:var(--text-muted);font-size:14px}
.login-form{display:grid;gap:12px;margin:0}
.login-form h2{margin:0 0 2px;font-size:19px}
.login-form .primary{width:100%;min-height:46px;font-size:16px}
.login-form .primary[disabled]{opacity:.65;cursor:progress}
.login-msg{min-height:20px;margin:0;color:var(--danger-text,#b3261e);font-size:14px}
.login-msg.ok{color:var(--success-text,#1a7f37)}
.login-links{display:grid;gap:10px;margin-top:6px;font-size:14px}
.login-links a{color:inherit}
.login-foot{max-width:440px;margin:6px auto 28px;padding:0 16px;text-align:center;font-size:13px;color:var(--text-muted)}
.login-foot nav{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.login-foot a{color:var(--text-muted)}
.brand-mark{width:44px;height:44px;border-radius:11px;flex:0 0 auto;display:block;background:linear-gradient(135deg,#3a7bd5,#2a5298);padding:9px;color:#fff}
</style>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script><script src="firebase-sync.js"></script><script src="pw-eye.js"></script><script src="wf-session.js"></script></head>
<body><header><div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><div><h1>الورشة الفنية</h1><p>دخول الموظفين</p></div></div></header>
<main class="login-main">
<section class="login-intro"><b>نظام إدارة ورش صيانة الأجهزة المنزلية</b><span>الصفحة دي لدخول الموظفين والمديرين فقط. لو انت عميل وعايز تتابع جهازك أو تبعت طلب صيانة، ادخل من بوابة العملاء.</span></section>
<section class="panel"><form id="loginForm" class="login-form" novalidate>
<h2>تسجيل الدخول</h2>
<label>البريد الإلكتروني<input id="em" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" required></label>
<label>كلمة المرور<input id="pw" name="password" type="password" autocomplete="current-password" required></label>
<button id="go" class="primary" type="submit">دخول</button>
<p id="msg" class="login-msg" role="alert" aria-live="polite"></p>
<div class="login-links"><a href="#" id="forgot">نسيت كلمة المرور؟</a><a href="portal.html">أنت عميل؟ ادخل من بوابة العملاء</a></div>
</form></section>
</main>
<footer class="login-foot"><nav><a href="privacy.html">سياسة الخصوصية</a><a href="terms.html">شروط الاستخدام</a><a href="portal.html">بوابة العملاء</a></nav><div>الورشة الفنية</div></footer>
<script>
(function(){
var form=document.getElementById("loginForm"),go=document.getElementById("go"),m=document.getElementById("msg");
function say(t,ok){m.textContent=t;m.className="login-msg"+(ok?" ok":"")}
form.addEventListener("submit",function(ev){
  ev.preventDefault();say("");
  var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
  if(!em||!pw){say("اكتب الإيميل وكلمة المرور.");return}
  go.disabled=true;
  firebase.auth().signInWithEmailAndPassword(em,pw).then(function(){if(window.WfSession)WfSession.remember(em,pw)}).catch(function(){say("تعذّر الدخول: بيانات غير صحيحة");}).then(function(){go.disabled=false});
});
document.getElementById("forgot").addEventListener("click",function(ev){
  ev.preventDefault();
  var e=document.getElementById("em").value.trim();
  if(!e){say("اكتب الإيميل الأول.");return}
  firebase.auth().sendPasswordResetEmail(e).then(function(){say("بعتنالك رابط تغيير كلمة المرور على الإيميل.",true)}).catch(function(){say("تعذّر الإرسال — تأكد من الإيميل.")});
});
})();
</script></body></html>
