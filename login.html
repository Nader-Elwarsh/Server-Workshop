<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001b4d"><title>الورشة الفنية | تسجيل الدخول</title><link rel="stylesheet" href="style.css"><script src="theme.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script><script src="firebase-sync.js"></script><script src="pw-eye.js"></script><script src="wf-session.js"></script></head>
<body><header><div class="brand"><img class="brand-logo" src="logo-header-v12.png" alt=""><div><h1>الورشة الفنية</h1><p>تسجيل الدخول</p></div></div></header>
<main><section class="panel"><label>البريد الإلكتروني<input id="em" type="email" autocomplete="username"></label><label>كلمة المرور<input id="pw" type="password" autocomplete="current-password"></label><button id="go" type="button">دخول</button><p id="msg" class="hint"></p><p><a href="#" onclick="forgotStaff();return false">نسيت كلمة المرور؟</a></p><p><a href="portal.html">🧑 أنت عميل؟ ادخل من بوابة العملاء</a></p></section></main>
<script>document.getElementById("go").onclick=function(){var m=document.getElementById("msg");m.textContent="";var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;firebase.auth().signInWithEmailAndPassword(em,pw).then(function(){if(window.WfSession)WfSession.remember(em,pw)}).catch(function(e){m.textContent="تعذّر الدخول: بيانات غير صحيحة";});};function forgotStaff(){var e=document.getElementById("em").value.trim(),m=document.getElementById("msg");if(!e){m.textContent="اكتب الإيميل الأول.";return}firebase.auth().sendPasswordResetEmail(e).then(function(){m.textContent="بعتنالك رابط تغيير كلمة المرور على الإيميل."}).catch(function(){m.textContent="تعذّر الإرسال — تأكد من الإيميل."})}</script></body></html>
